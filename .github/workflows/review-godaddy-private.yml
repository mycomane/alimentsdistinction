name: Approved temporary subscriber frontend review
on:
  push:
    branches: [feat/wordpress-woocommerce-theme]
    paths: ['.github/workflows/review-godaddy-private.yml']
permissions:
  contents: read
concurrency:
  group: godaddy-temp-site-mutation
  cancel-in-progress: false
jobs:
  review:
    if: github.ref == 'refs/heads/feat/wordpress-woocommerce-theme'
    runs-on: ubuntu-latest
    environment: godaddy-temp
    timeout-minutes: 18
    env:
      SSH_HOST: 1302636.us22.ssh.myftpupload.com
      SSH_USERNAME: ${{ secrets.GODADDY_SSH_USERNAME }}
      SSH_PASSWORD: ${{ secrets.GODADDY_SSH_PASSWORD }}
      PINNED_FINGERPRINT: 'SHA256:oxYa4nr7BL5hXCIG5j/OOk54R6yNokpACBoa3tn+Kp4'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate scoped code before connecting
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = feat/wordpress-woocommerce-theme
          test -n "$SSH_USERNAME" && test -n "$SSH_PASSWORD"
          php -l scripts/ops/review-account.php
          bash -n scripts/ops/review-account.sh
          node --check scripts/qa/hosted-review.cjs
          tar -czf "$RUNNER_TEMP/ad-review-ops.tar.gz" -C scripts/ops review-account.php review-account.sh
      - name: Verify pinned SSH identity
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          timeout 18 ssh-keyscan -T 10 -t ed25519 -p 22 "$SSH_HOST" > "$HOME/.ssh/known_hosts" 2>/dev/null
          test -s "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          observed="$(ssh-keygen -lf "$HOME/.ssh/known_hosts" -E sha256 | awk '{print $2}')"
          test "$observed" = "$PINNED_FINGERPRINT"
      - name: Prepare existing SSH transport and isolated browser
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          npm install --prefix "$RUNNER_TEMP/ad-review-tools" playwright@1.56.1 --no-audit --no-fund
          "$RUNNER_TEMP/ad-review-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify anonymous Coming Soon from document load before provisioning
        run: node scripts/qa/hosted-review.cjs --public-only
      - name: Transfer scoped operation scripts outside public root
        run: |
          set -euo pipefail
          export SSHPASS="$SSH_PASSWORD"
          digest="$(sha256sum "$RUNNER_TEMP/ad-review-ops.tar.gz" | awk '{print $1}')"
          sshpass -e scp -q -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o PreferredAuthentications=password -o PubkeyAuthentication=no -P 22 "$RUNNER_TEMP/ad-review-ops.tar.gz" "$SSH_USERNAME@$SSH_HOST:.ad-review-ops-$GITHUB_RUN_ID.tar.gz"
          sshpass -e ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o PreferredAuthentications=password -o PubkeyAuthentication=no -o ConnectTimeout=12 "$SSH_USERNAME@$SSH_HOST" "bash -s -- '$GITHUB_RUN_ID' '$digest'" <<'REMOTE'
          set -euo pipefail
          umask 077
          case "$1" in ''|*[!0-9]*) exit 1;; esac
          archive="$HOME/.ad-review-ops-$1.tar.gz"
          test "$(sha256sum "$archive" | awk '{print $1}')" = "$2"
          root=''
          for candidate in "$PWD" "$HOME" "$HOME/html" "$HOME/public_html" "$PWD/html" "$PWD/public_html"; do
            if [ -f "$candidate/wp-load.php" ]; then root="$candidate"; break; fi
          done
          if [ -z "$root" ]; then
            found="$(find "$HOME" -maxdepth 4 -type f -name wp-load.php -print -quit 2>/dev/null || true)"
            [ -z "$found" ] || root="$(dirname "$found")"
          fi
          test -n "$root"
          root="$(cd "$root" && pwd -P)"
          home_dir="$(cd "$HOME" && pwd -P)"
          case "$home_dir/" in "$root/"*) exit 1;; esac
          test "$(wp --path="$root" --skip-plugins --skip-themes option get siteurl 2>/dev/null)" = 'https://1302636.us22.myftpupload.com'
          private="$HOME/.ad-review-ops-$1"
          test ! -e "$private"
          mkdir -m 700 "$private"
          tar -xzf "$archive" -C "$private"
          php -r 'unlink($argv[1]);' "$archive"
          REMOTE
      - name: Provision approved subscriber and private 30-minute session
        id: provision
        run: |
          set -euo pipefail
          umask 077
          export SSHPASS="$SSH_PASSWORD"
          # stdout contains a native subscriber session cookie. Never cat, echo, mask-print or upload it.
          if ! sshpass -e ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o PreferredAuthentications=password -o PubkeyAuthentication=no -o ConnectTimeout=12 "$SSH_USERNAME@$SSH_HOST" "bash .ad-review-ops-$GITHUB_RUN_ID/review-account.sh create '$GITHUB_RUN_ID'" > "$RUNNER_TEMP/ad-review-session.json" 2> "$RUNNER_TEMP/ad-review-private-error.txt"; then
            echo '::error::Subscriber provisioning failed; details kept private. Cleanup will still run.'
            exit 1
          fi
          chmod 600 "$RUNNER_TEMP/ad-review-session.json"
          echo 'PASS: subscriber-only session provisioned privately; no credential printed.'
      - name: Read-only hosted layout and navigation checks
        run: |
          set -euo pipefail
          python3 -m http.server 8788 --bind 127.0.0.1 > "$RUNNER_TEMP/ad-review-reference.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          node scripts/qa/hosted-review.cjs
      - name: Revoke session and delete only this run's subscriber
        if: always() && (steps.provision.outcome == 'success' || steps.provision.outcome == 'failure' || steps.provision.outcome == 'cancelled')
        run: |
          set -euo pipefail
          export SSHPASS="$SSH_PASSWORD"
          if ! sshpass -e ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o PreferredAuthentications=password -o PubkeyAuthentication=no -o ConnectTimeout=12 "$SSH_USERNAME@$SSH_HOST" "bash .ad-review-ops-$GITHUB_RUN_ID/review-account.sh cleanup '$GITHUB_RUN_ID'" > "$RUNNER_TEMP/ad-review-cleanup.txt" 2> "$RUNNER_TEMP/ad-review-cleanup-error.txt"; then
            echo '::error::Cleanup could not be confirmed. Session expires after 30 minutes; inspect and remove the disposable account through the same protected environment. Never escalate its role.'
            exit 1
          fi
          # Emit only fixed success markers, never private stderr or arbitrary remote output.
          grep -Fx 'PASS: temporary subscriber removed and sessions revoked.' "$RUNNER_TEMP/ad-review-cleanup.txt"
          grep -Fx 'PASS: protected settings and product/order counts unchanged.' "$RUNNER_TEMP/ad-review-cleanup.txt"
      - name: Discard runner session files
        if: always()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          for name in ['ad-review-session.json', 'ad-review-private-error.txt', 'ad-review-cleanup-error.txt']:
              Path(os.environ['RUNNER_TEMP'], name).unlink(missing_ok=True)
          PY
