name: P1 approved copy — targeted isolated WordPress review
on:
  push:
    branches: [feat/wordpress-woocommerce-theme]
    paths:
      - '.github/workflows/qa-p1-approved-copy.yml'
      - '.github/workflows/qa-wordpress-isolated.yml'
      - 'tests/p1-copy-isolated/**'
      - 'wordpress/aliments-distinction/footer.php'
      - 'wordpress/aliments-distinction/front-page.php'
      - 'wordpress/aliments-distinction/style.css'
      - 'wordpress/aliments-distinction/template-parts/navigation.php'
permissions:
  contents: read
jobs:
  targeted-copy:
    if: github.ref == 'refs/heads/feat/wordpress-woocommerce-theme'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Guard approved scope, original design and syntax
        run: |
          set -euo pipefail
          python3 tests/p1-copy-isolated/scope.py
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-xml php-mbstring php-curl php-gd
          python3 scripts/check-theme.py
          php -l tests/p1-copy-isolated/fixture.php
      - name: Reuse disposable WordPress and French packages, no new test account
        run: |
          set -euo pipefail
          python3 scripts/qa/prepare.py
          php scripts/qa/seed.php
          php scripts/qa/fixtures.php
          python3 scripts/locale/prepare-packages.py --isolated
          php tests/p1-copy-isolated/fixture.php locale
      - name: Reuse pinned browser and parse CSS
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/ad-p1-copy-tools" playwright@1.56.1 postcss@8.5.6 --no-audit --no-fund
          "$RUNNER_TEMP/ad-p1-copy-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Before and after review, footer branches and focus at 390 and 1440
        env:
          NODE_PATH: ${{ runner.temp }}/ad-p1-copy-tools/node_modules
        run: |
          set -euo pipefail
          php -S 127.0.0.1:8787 -t "$RUNNER_TEMP/ad-isolated-qa/wordpress" "$RUNNER_TEMP/ad-isolated-qa/router.php" > "$RUNNER_TEMP/ad-qa-php.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          node tests/p1-copy-isolated/browser.cjs
          php scripts/qa/no-orders.php
          python3 scripts/qa/php-log-check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p1-approved-copy-evidence
          path: ${{ runner.temp }}/ad-isolated-qa/evidence/
          retention-days: 14
          if-no-files-found: ignore
