name: Smoke test temporary Aliments Distinction site (public read-only)

on:
  push:
    branches:
      - feat/wordpress-woocommerce-theme
    paths:
      - '.github/workflows/smoke-test-temporary-site.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.ref == 'refs/heads/feat/wordpress-woocommerce-theme'
    name: Check public temporary site only
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe homepage without credentials or changes
        shell: bash
        run: |
          set -euo pipefail
          url='https://1302636.us22.myftpupload.com/'
          echo "Temporary site HTTP check: $url"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          status="$(curl -sS --max-time 25 --max-redirs 0 -o "$tmp/page.html" -w '%{http_code}' "$url" || true)"
          echo "HTTP status: $status"
          if [ "$status" != '200' ]; then
            echo "::warning::Homepage did not return HTTP 200. This may be a temporary site access/coming-soon restriction."
            exit 0
          fi
          echo "Homepage response size: $(wc -c < "$tmp/page.html") bytes"
          if grep -qi 'wp-content/themes/aliments-distinction/' "$tmp/page.html"; then
            echo "PASS: Aliments Distinction theme paths are present in the public homepage."
          else
            echo "::warning::Custom theme paths not detected in public HTML; could be cache, coming-soon page, or theme not rendering."
          fi
          if grep -qiE '(maintenance mode|coming soon|launch my site)' "$tmp/page.html"; then
            echo "::notice::Potential coming-soon or maintenance content detected."
          fi
          python3 - "$tmp/page.html" <<'PYCODE'
          from pathlib import Path
          import re, sys, json
          from html.parser import HTMLParser
          class VisibleText(HTMLParser):
              def __init__(self): super().__init__(); self.hidden=0; self.text=[]
              def handle_starttag(self, tag, attrs):
                  if tag in ('script','style'): self.hidden += 1
              def handle_endtag(self, tag):
                  if tag in ('script','style') and self.hidden: self.hidden -= 1
              def handle_data(self, data):
                  if not self.hidden: self.text.append(data)
          html=Path(sys.argv[1]).read_text(errors='replace')
          parser=VisibleText(); parser.feed(html)
          text=' '.join(' '.join(parser.text).split()).lower()
          markers={
              'theme_assets': 'wp-content/themes/aliments-distinction/' in html,
              'design_hero_markup': bool(re.search(r'class=["\'][^"\']*\bhero\b',html)),
              'design_hero_text': 'que vous' in text and 'méritez' in text,
              'coming_soon_in_text': 'coming soon' in text,
              'maintenance_in_text': 'maintenance mode' in text,
              'no_redirects_followed': True,
          }
          print('Public response classification (booleans only): '+json.dumps(markers))
          if markers['design_hero_markup'] and markers['design_hero_text']:
              print('::warning::Design homepage is visible anonymously; verify visibility protection before any further hosted changes. No visibility setting was changed by this probe.')
          PYCODE
          echo "No user data, cookies, private credentials, or page content emitted."
