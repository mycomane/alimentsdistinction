name: Identify GoDaddy temporary SSH host (no credentials)

on:
  push:
    branches:
      - feat/wordpress-woocommerce-theme
    paths:
      - '.github/workflows/verify-godaddy-ssh-login.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fingerprint:
    name: Discover SSH host fingerprint without using secrets
    if: github.ref == 'refs/heads/feat/wordpress-woocommerce-theme'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Discover offered SSH host fingerprints without authenticating
        shell: bash
        run: |
          set -euo pipefail
          host='1302636.us22.ssh.myftpupload.com'
          echo "Checking SSH host identity for $host"
          getent ahostsv4 "$host" | head -n 1
          file="$(mktemp)"
          trap 'rm -f "$file"' EXIT
          timeout 20 ssh-keyscan -T 10 -p 22 "$host" > "$file" 2>/dev/null
          test -s "$file"
          echo "Unverified SSH host-key fingerprints (compare through a trusted source before authenticating):"
          ssh-keygen -lf "$file" -E sha256
          echo "Probe complete. No credentials were accessed; no remote commands or deployment performed."
