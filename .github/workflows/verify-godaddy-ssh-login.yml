name: Verify temporary GoDaddy SSH login (read-only)

on:
  push:
    branches:
      - feat/wordpress-woocommerce-theme
    paths:
      - '.github/workflows/verify-godaddy-ssh-login.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Approved SSH authentication only - no deployment
    if: github.ref == 'refs/heads/feat/wordpress-woocommerce-theme'
    runs-on: ubuntu-latest
    environment: godaddy-temp
    timeout-minutes: 5
    env:
      SSH_HOST: 1302636.us22.ssh.myftpupload.com
      SSH_USERNAME: ${{ secrets.GODADDY_SSH_USERNAME }}
      SSH_PASSWORD: ${{ secrets.GODADDY_SSH_PASSWORD }}
      # Pinned from initial read-only GitHub Actions fingerprint discovery.
      # For maximum assurance, independently confirm it with the hosting provider.
      PINNED_ED25519_SHA256: 'SHA256:oxYa4nr7BL5hXCIG5j/OOk54R6yNokpACBoa3tn+Kp4'
    steps:
      - name: Ensure credentials are configured (no values printed)
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$SSH_USERNAME" ] || [ -z "$SSH_PASSWORD" ]; then
            echo "::error::Missing godaddy-temp environment secrets: GODADDY_SSH_USERNAME or GODADDY_SSH_PASSWORD"
            exit 1
          fi
      - name: Validate pinned ED25519 SSH host identity before password authentication
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          timeout 18 ssh-keyscan -T 10 -t ed25519 -p 22 "$SSH_HOST" > "$HOME/.ssh/known_hosts" 2>/dev/null
          test -s "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          observed="$(ssh-keygen -lf "$HOME/.ssh/known_hosts" -E sha256 | awk '{print $2}')"
          if [ "$observed" != "$PINNED_ED25519_SHA256" ]; then
            echo "::error::Host identity mismatch; refusing to send credentials."
            exit 1
          fi
          echo "Pinned server identity matches initial observation."
      - name: Install SSH password client
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
      - name: Authenticate and execute no-op only
        shell: bash
        run: |
          set -euo pipefail
          export SSHPASS="$SSH_PASSWORD"
          sshpass -e ssh \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o NumberOfPasswordPrompts=1 \
            -o ConnectTimeout=12 \
            -p 22 "$SSH_USERNAME@$SSH_HOST" 'true'
          unset SSHPASS
          echo "SSH authentication succeeded. No deployment or site changes performed."
