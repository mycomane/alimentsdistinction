name: French Canadian configuration — temporary site, mandatory reviewer
# Revision 3: native reusable QA dependency; no cross-run polling deadline.
# WPLANG and pinned core/WooCommerce fr_CA only; NEW human approval mandatory.
on:
  # Temporary authorized push trigger removed after queueing the new review run.
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: godaddy-temp-site-mutation
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/feat/wordpress-woocommerce-theme'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify pinned translations, unchanged theme and recovery without GoDaddy
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = feat/wordpress-woocommerce-theme
          python3 scripts/check-theme.py
          python3 tests/locale-workflow.py
          python3 scripts/locale/prepare-packages.py
          python3 scripts/locale/prepare-release.py
          for file in scripts/locale/*.php; do php -l "$file"; done
          bash -n scripts/locale/update-temp.sh
          shellcheck scripts/locale/update-temp.sh scripts/ops/measure-p0-db.sh
          php tests/p0-files.php
          php tests/p0-db-size.php
          php tests/locale-files.php
          php tests/locale-public.php
          sudo php tests/locale-ownership.php
          python3 tests/locale-deployment.py
      - uses: actions/upload-artifact@v4
        with:
          name: locale-fr-ca-review-package
          path: |
            ${{ runner.temp }}/ad-fr-ca-payload/review-package.tar.gz
            ${{ runner.temp }}/ad-fr-ca-payload/manifest.json
            ${{ runner.temp }}/ad-fr-ca-payload/theme-manifest.json
          retention-days: 14
          if-no-files-found: error
  isolated-qa:
    if: github.ref == 'refs/heads/feat/wordpress-woocommerce-theme'
    permissions:
      contents: read
    uses: ./.github/workflows/qa-locale-fr-ca.yml
  deploy:
    needs: [prepare, isolated-qa]
    # Julien authorized preparation only: stop at the NEW human environment review.
    if: github.ref == 'refs/heads/feat/wordpress-woocommerce-theme'
    name: APPROVAL REQUIRED — fr_CA language only on temporary WordPress
    runs-on: ubuntu-latest
    environment: godaddy-temp
    timeout-minutes: 18
    env:
      SSH_HOST: 1302636.us22.ssh.myftpupload.com
      SSH_USERNAME: ${{ secrets.GODADDY_SSH_USERNAME }}
      SSH_PASSWORD: ${{ secrets.GODADDY_SSH_PASSWORD }}
      PINNED_FINGERPRINT: 'SHA256:oxYa4nr7BL5hXCIG5j/OOk54R6yNokpACBoa3tn+Kp4'
    steps:
      - name: Require recorded human approval for this exact run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = feat/wordpress-woocommerce-theme
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/approvals" > "$RUNNER_TEMP/locale-approvals.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          rows = json.loads(Path(os.environ['RUNNER_TEMP'], 'locale-approvals.json').read_text())
          assert any(r.get('state') == 'approved' and r.get('user', {}).get('login') == 'mycomane'
                     and any(e.get('name') == 'godaddy-temp' for e in r.get('environments', [])) for r in rows), 'Human approval missing; no remote operation allowed'
          print('PASS: mycomane approval recorded for godaddy-temp on this exact run.')
          PY
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Recheck approved commit and build exact translation-only bundle
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 scripts/check-theme.py
          python3 scripts/locale/prepare-packages.py
          python3 scripts/locale/prepare-release.py
          mkdir -p "$RUNNER_TEMP/locale-ops/locale" "$RUNNER_TEMP/locale-ops/ops" "$RUNNER_TEMP/locale-ops/payload"
          cp scripts/locale/files.php scripts/locale/state.php scripts/locale/wp-functions.php scripts/locale/public-check.php scripts/locale/space.php scripts/locale/update-temp.sh "$RUNNER_TEMP/locale-ops/locale/"
          cp scripts/ops/p0-files.php scripts/ops/p0-db-size.php scripts/ops/p0-db-size.sql scripts/ops/measure-p0-db.sh "$RUNNER_TEMP/locale-ops/ops/"
          cp "$RUNNER_TEMP/ad-fr-ca-payload/manifest.json" "$RUNNER_TEMP/ad-fr-ca-payload/theme-manifest.json" "$RUNNER_TEMP/locale-ops/"
          cp -a "$RUNNER_TEMP/ad-fr-ca-payload/languages" "$RUNNER_TEMP/locale-ops/payload/languages"
          tar -czf "$RUNNER_TEMP/locale-ops.tar.gz" -C "$RUNNER_TEMP/locale-ops" .
      - name: Pin SSH identity before authentication
        run: |
          set -euo pipefail
          test -n "$SSH_USERNAME" && test -n "$SSH_PASSWORD"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          timeout 18 ssh-keyscan -T 10 -t ed25519 -p 22 "$SSH_HOST" > "$HOME/.ssh/known_hosts" 2>/dev/null
          test -s "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          test "$(ssh-keygen -lf "$HOME/.ssh/known_hosts" -E sha256 | awk '{print $2}')" = "$PINNED_FINGERPRINT"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
      - name: Check temporary identity read-only, then transfer private operation bundle
        run: |
          set -euo pipefail
          export SSHPASS="$SSH_PASSWORD"
          ssh_opts=(-o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o PreferredAuthentications=password -o PubkeyAuthentication=no -o NumberOfPasswordPrompts=1 -o ConnectTimeout=12)
          sshpass -e ssh "${ssh_opts[@]}" "$SSH_USERNAME@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          root=''
          for c in "$PWD" "$HOME" "$HOME/html" "$HOME/public_html" "$PWD/html" "$PWD/public_html"; do
            if [ -f "$c/wp-load.php" ]; then root="$c"; break; fi
          done
          if [ -z "$root" ]; then
            f="$(find "$HOME" -maxdepth 4 -type f -name wp-load.php -print -quit 2>/dev/null || true)"
            [ -z "$f" ] || root="$(dirname "$f")"
          fi
          test -n "$root"
          root="$(cd "$root" && pwd -P)"
          private_home="$(cd "$HOME" && pwd -P)"
          case "$private_home/" in "$root/"*) exit 1;; esac
          test "$(wp --path="$root" --skip-plugins --skip-themes option get siteurl)" = 'https://1302636.us22.myftpupload.com'
          test "$(wp --path="$root" --skip-plugins --skip-themes option get home)" = 'https://1302636.us22.myftpupload.com'
          echo 'PASS: exact temporary site and private home confirmed before upload.'
          REMOTE
          sshpass -e scp -q "${ssh_opts[@]}" "$RUNNER_TEMP/locale-ops.tar.gz" "$SSH_USERNAME@$SSH_HOST:.ad-locale-ops-$GITHUB_RUN_ID.tar.gz"
          digest="$(sha256sum "$RUNNER_TEMP/locale-ops.tar.gz" | awk '{print $1}')"
          sshpass -e ssh "${ssh_opts[@]}" "$SSH_USERNAME@$SSH_HOST" "bash -s -- '$GITHUB_RUN_ID' '$digest'" <<'REMOTE'
          set -euo pipefail
          umask 077
          case "$1" in ''|*[!0-9]*) exit 1;; esac
          archive="$HOME/.ad-locale-ops-$1.tar.gz"
          private="$HOME/.ad-locale-ops-$1"
          test ! -e "$private"
          test "$(sha256sum "$archive" | awk '{print $1}')" = "$2"
          mkdir -m 700 "$private"
          tar -xzf "$archive" -C "$private"
          rm -- "$archive"
          bash "$private/locale/update-temp.sh" "$1"
          REMOTE
      - name: Report technical scope and remaining private review
        run: |
          echo 'fr_CA effective and pinned translations verified. Coming Soon, theme and commercial settings preserved. Stored privacy content unchanged; no test account created.' >> "$GITHUB_STEP_SUMMARY"
